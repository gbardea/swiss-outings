<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Swiss Outings</title>
<meta name="description" content="Concerts, carnivals, cow parades and village gigs across Switzerland, planned together.">
<meta property="og:title" content="Swiss Outings">
<meta property="og:description" content="Concerts, carnivals, cow parades and village gigs across Switzerland, found for you every morning.">
<meta property="og:image" content="https://www.swissoutings.com/icons/icon-512.png">
<meta property="og:url" content="https://www.swissoutings.com/">
<meta name="theme-color" content="#D52B1E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Outings">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div id="gate" hidden></div>
<header class="top">
  <div class="wrap">
    <div class="bar">
      <div class="brand">
        <span class="cross" aria-hidden="true"><svg viewBox="0 0 12 12"><path d="M4.5 1h3v3.5H11v3H7.5V11h-3V7.5H1v-3h3.5z" fill="#fff"/></svg></span>
        <h1>Swiss Outings</h1>
        <small id="subline">Switzerland</small>
      </div>
      <nav class="seg" aria-label="View">
        <button data-view="discover" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5z"/></svg><span>Discover</span></button>
        <button data-view="calendar" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span>Calendar</span></button>
        <button data-view="who" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3 20a6 6 0 0 1 12 0"/><path d="M16 4.5a3.2 3.2 0 0 1 0 6.4M18 14a6 6 0 0 1 3 6"/></svg><span>For whom</span></button>
        <button data-view="ours" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7.5-4.6-9.5-9.2C1 8.3 3.3 5 6.6 5c2 0 3.4 1.1 4.4 2.5C12 6.1 13.4 5 15.4 5 18.7 5 21 8.3 19.5 11.8 17.5 16.4 12 21 12 21z"/></svg><span>Plans</span></button>
      </nav>
      <button class="iconbtn invbtn" type="button" data-invite-open aria-label="Invite people"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="8" r="3.2"/><path d="M3 20a6 6 0 0 1 12 0"/><path d="M19 8v6M16 11h6"/></svg>Invite</button>
      <button class="iconbtn menubtn" id="openMenu" type="button" aria-label="Menu: settings, help, contact"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    </div>
    <div class="filters" id="filters">
      <div class="search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" placeholder="Search bands, villages, venues…" aria-label="Search events"></div>
      <div class="chips" id="audChips" role="group" aria-label="Audience"></div>
      <select class="chip" id="when" aria-label="Time range">
        <option value="all">Any time</option>
        <option value="7">Next 7 days</option>
        <option value="30">Next 30 days</option>
        <option value="90">Next 3 months</option>
        <option value="later">3+ months out</option>
      </select>
      <select class="chip" id="region" aria-label="Region">
        <option value="all">All Switzerland</option>
        <option value="near">Zurich &amp; Gold Coast</option>
        <option value="Gold Coast">Gold Coast only</option>
        <option value="Zurich City">Zurich City</option>
        <option value="Canton Zurich">Canton Zurich</option>
        <option value="Switzerland">Rest of Switzerland</option>
      </select>
      <div class="more-filters">
        <div class="chips" id="toggles"></div>
      </div>
      <div class="catrow" id="catChips" role="group" aria-label="Category"></div>
      <div class="fdone"><button class="chip" id="clearFilters" type="button">Clear all</button><button class="btn primary" id="closeFilters" type="button">Show events</button></div>
    </div>
  </div>
</header>

<main class="wrap" id="main">
  <div class="grid" aria-busy="true"><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>
</main>

<div class="fscrim" id="fscrim"></div>
<div id="sheetHost"></div>
<div id="toastHost" aria-live="polite"></div>
<script src="/vendor/supabase.min.js"></script>
<script src="/config.js"></script>
<script src="/native.js"></script>
<script src="/install.js"></script>
<script src="/core.js"></script>
<script src="/story.js"></script>
<script src="/planner.js"></script>
<script src="/app.js"></script>
</body>
</html>
