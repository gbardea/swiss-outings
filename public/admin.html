<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Admin · Swiss Outings</title>
<link rel="icon" href="/icons/icon-192.png">
<style>
:root{--bg:#EEF1EE;--s:#fff;--s2:#F6F8F6;--ink:#14181D;--mu:#5A646D;--line:#D6DCD7;--acc:#1D4ED8;--red:#D52B1E;--good:#14804A;--bad:#B91C1C;--heart:#D6336C}
@media (prefers-color-scheme:dark){:root{--bg:#0F1215;--s:#171B20;--s2:#1D2228;--ink:#EDF0ED;--mu:#98A2AB;--line:#2A3138;--acc:#86A4FF;--good:#4CC38A;--bad:#F87171;--heart:#F06595}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,select{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
.bar{display:flex;align-items:center;gap:12px;padding:12px 0;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;font-weight:900;font-size:18px;text-decoration:none;color:inherit;margin-right:auto}
.x{width:24px;height:24px;border-radius:6px;background:var(--red);display:grid;place-items:center}
nav{display:flex;gap:4px;overflow-x:auto;max-width:100%}
nav button{border:0;background:transparent;padding:7px 12px;border-radius:999px;font-weight:600;color:var(--mu);cursor:pointer;white-space:nowrap}
nav button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.badge{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;line-height:18px;text-align:center;margin-left:4px}
main{padding:18px 0 60px}
h2{font-size:22px;margin:0 0 12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:18px}
.kpi{background:var(--s);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi b{display:block;font-size:26px;font-variant-numeric:tabular-nums;line-height:1.2}.kpi span{color:var(--mu);font-size:12.5px}
.panel{background:var(--s);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:16px;overflow:auto}
.panel h3{margin:0 0 10px;font-size:15px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top;white-space:nowrap}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--mu);font-weight:600;position:sticky;top:0;background:var(--s);cursor:pointer}
td.wrapc{white-space:normal;min-width:200px}
tr.click{cursor:pointer}tr.click:hover td{background:var(--s2)}
.num{text-align:right}
.muted{color:var(--mu)}
.pill{display:inline-block;padding:1px 7px;border-radius:999px;font-size:11.5px;font-weight:600;border:1px solid var(--line)}
.k-view{color:var(--mu)}.k-keen,.k-unkeen{color:var(--heart)}.k-going,.k-ungoing{color:var(--good)}.k-hide{color:var(--bad)}.k-share,.k-invite{color:var(--acc)}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.tools input,.tools select{background:var(--s);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
.btn{border:1px solid var(--line);background:var(--s2);border-radius:8px;padding:7px 12px;font-weight:600;cursor:pointer}
.btn.p{background:var(--acc);color:#fff;border-color:var(--acc)}.btn.danger{color:var(--bad)}
.chart{display:flex;align-items:flex-end;gap:3px;height:110px;padding-top:6px}
.chart div{flex:1;background:var(--acc);border-radius:3px 3px 0 0;min-height:2px;position:relative}
.chart div.alt{background:var(--red)}
.chart-x{display:flex;justify-content:space-between;color:var(--mu);font-size:11px;margin-top:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media (max-width:820px){.grid2{grid-template-columns:1fr}}
.drawer{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;justify-content:flex-end;z-index:20}
.drawer>div{background:var(--bg);width:min(720px,100%);height:100%;overflow:auto;padding:18px 18px 60px}
.msg{border:1px solid var(--line);background:var(--s);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.msg.done{opacity:.55}.msg p{white-space:pre-wrap;margin:8px 0}
.center{max-width:420px;margin:12vh auto;text-align:center;background:var(--s);border:1px solid var(--line);border-radius:16px;padding:28px}
.mfa{max-width:460px}.mfa ol{text-align:left;padding-left:20px;color:var(--m,#5A646D);font-size:14px}.mfaqr{width:190px;height:190px;background:#fff;border-radius:12px;padding:8px;margin:6px auto;display:block}
.mfaform{display:flex;gap:8px;justify-content:center;margin:10px 0}.mfaform input{width:140px;font:600 22px/1 ui-monospace,Menlo,monospace;letter-spacing:.2em;text-align:center;padding:10px;border:1px solid var(--line);border-radius:10px}
.mfa code{font-size:12px;word-break:break-all}.mfa .small{font-size:12.5px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:30}
</style>
</head>
<body>
<header><div class="wrap bar">
  <a class="brand" href="/"><span class="x"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M4.5 1h3v3.5H11v3H7.5V11h-3V7.5H1v-3h3.5z" fill="#fff"/></svg></span>Swiss Outings admin</a>
  <nav id="tabs">
    <button data-tab="overview">Overview</button><button data-tab="users">Users</button><button data-tab="activity">Activity</button>
    <button data-tab="events">Events</button><button data-tab="messages">Messages</button><button data-tab="households">Households</button>
  </nav>
</div></header>
<main class="wrap" id="main"><p class="muted">Loading…</p></main>
<div id="drawer"></div>
<script src="/vendor/supabase.min.js"></script>
<script src="/config.js"></script>
<script src="/admin.js"></script>
</body>
</html>
